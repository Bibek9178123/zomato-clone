spring:
  application:
    name: zomato-clone
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/zomato_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:bibek12345}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s
  elasticsearch:
    uris: http://localhost:9200
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8081}

jwt:
  secret: ${JWT_SECRET:zomatoCloneSecretKeyForJWTTokenGenerationAndValidation2024MustBe256BitsLong}
  expiration: 86400000

stripe:
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_51UOGbvEDOj3oB1kHMhH0rc1aYQURNdVmb49H5JhpDXnJ1PMArlsqh5LsblFXjOl7t6CSU6M3oY7JS2gdUYAs21RK00a52u1ASf}
  secret-key: ${STRIPE_SECRET_KEY:sk_test_YOUR_STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_YOUR_WEBHOOK_SECRET}
  currency: inr

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:AIzaSyBL6TVrtcHUZZkv6PD4uPEWZJw4iC0CsGg}

app:
  rate-limit:
    capacity: 20
    refill-tokens: 20
    refill-duration-minutes: 1
  firebase:
    service-account-file: classpath:firebase-service-account.json
    database-url: https://zomato-clone-f199a-default-rtdb.firebaseio.com
    storage-bucket: zomato-clone-f199a.appspot.com

logging:
  level:
    com.zomato: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/zomato-clone.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
